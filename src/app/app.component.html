<header class="barra">
  <a routerLink="/reservas" class="marca">{{ title }}</a>

  @if (sesion.autenticado()) {
    <nav class="navegacion" aria-label="Principal">
      <a routerLink="/amigos" routerLinkActive="activo" ariaCurrentWhenActive="page">
        Amigos
        @if (pendientes() > 0) {
          <span class="insignia" aria-hidden="true">{{ pendientes() }}</span>
          <span class="visualmente-oculto">{{ textoPendientes() }}</span>
        }
      </a>
    </nav>
  }

  @if (sesion.esAdmin()) {
    <nav class="navegacion" aria-label="Administración">
      <a routerLink="/admin/salas" routerLinkActive="activo" ariaCurrentWhenActive="page">Salas</a>
      <a routerLink="/admin/usuarios" routerLinkActive="activo" ariaCurrentWhenActive="page">Usuarios</a>
      <a routerLink="/admin/ajustes" routerLinkActive="activo" ariaCurrentWhenActive="page">Ajustes</a>
    </nav>
  }

  @if (sesion.usuario(); as usuario) {
    <div class="sesion">
      <p class="usuario">
        <span class="visualmente-oculto">Sesión iniciada como </span>{{ usuario.nombre }}
        @if (sesion.esAdmin()) {
          <span class="rol">(administrador)</span>
        }
      </p>
      <button type="button" class="boton-barra" [disabled]="saliendo()" (click)="salir()">
        {{ saliendo() ? 'Saliendo…' : 'Salir' }}
      </button>
    </div>
  }
</header>

<main class="contenido">
  <router-outlet />
</main>
